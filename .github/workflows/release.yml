name: Release rapidsim

on:
  repository_dispatch:
    types:
      - rapid-release
      - rapid-release-test

  workflow_dispatch:
    inputs:
      rapid_tag:
        description: "RAPID release tag to test"
        required: true
        default: "v2.2.3"

      previous_rapid_tag:
        description: "Previous RAPID release tag"
        required: true
        default: "v2.2.2"

jobs:
  prepare-release:
    name: Prepare release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout rapidsim
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Determine RAPID release tags
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            rapid_tag="${{ inputs.rapid_tag }}"
            previous_rapid_tag="${{ inputs.previous_rapid_tag }}"
            echo "MANUAL TEST MODE"

          elif [ "${{ github.event.action }}" = "rapid-release-test" ]; then
            rapid_tag="${{ github.event.client_payload.rapid_tag }}"
            previous_rapid_tag="${{ github.event.client_payload.previous_rapid_tag }}"
            echo "DISPATCH TEST MODE"

          else
            rapid_tag="${{ github.event.client_payload.rapid_tag }}"

            git -C external/RAPID fetch --tags

            previous_rapid_tag=$(
              git -C external/RAPID describe \
                --tags \
                --abbrev=0 \
                HEAD
            )

            echo "REAL RELEASE MODE"
          fi

          echo "RAPID previous tag: $previous_rapid_tag"
          echo "RAPID new tag:      $rapid_tag"

          echo "rapid_tag=$rapid_tag" >> "$GITHUB_OUTPUT"
          echo "previous_rapid_tag=$previous_rapid_tag" >> "$GITHUB_OUTPUT"

      - name: Calculate rapidsim version
        id: version
        shell: bash
        run: |
          rapid_tag="${{ steps.release.outputs.rapid_tag }}"
          previous_rapid_tag="${{ steps.release.outputs.previous_rapid_tag }}"

          rapid_version="${rapid_tag#v}"
          previous_rapid_version="${previous_rapid_tag#v}"

          rapid_version="${rapid_version%%-*}"
          previous_rapid_version="${previous_rapid_version%%-*}"

          current_rapidsim=$(python - <<'PY'
          import re

          with open("pyproject.toml") as f:
              text = f.read()

          match = re.search(
              r'(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"',
              text
          )

          if not match:
              raise SystemExit("Could not determine rapidsim version")

          print(match.group(1))
          PY
          )

          echo "Previous RAPID:   $previous_rapid_version"
          echo "New RAPID:        $rapid_version"
          echo "Current rapidsim: $current_rapidsim"

          IFS='.' read -r current_major current_minor current_patch <<< "$current_rapidsim"
          IFS='.' read -r prev_major prev_minor prev_patch <<< "$previous_rapid_version"
          IFS='.' read -r new_major new_minor new_patch <<< "$rapid_version"

          if [ "$new_major" -gt "$prev_major" ]; then
            next_major=$((current_major + 1))
            next_minor=0
            next_patch=0

          elif [ "$new_minor" -gt "$prev_minor" ]; then
            next_major=$current_major
            next_minor=$((current_minor + 1))
            next_patch=0

          else
            next_major=$current_major
            next_minor=$current_minor
            next_patch=$((current_patch + 1))
          fi

          next_version="${next_major}.${next_minor}.${next_patch}"

          echo "New rapidsim:     $next_version"

          echo "version=$next_version" >> "$GITHUB_OUTPUT"

      - name: Test mode summary
        if: github.event_name == 'workflow_dispatch' || github.event.action == 'rapid-release-test'
        run: |
          echo "======================================"
          echo "RAPIDSIM RELEASE TEST"
          echo "======================================"
          echo "Previous RAPID:   ${{ steps.release.outputs.previous_rapid_tag }}"
          echo "New RAPID:        ${{ steps.release.outputs.rapid_tag }}"

          echo "Current rapidsim: $(python - <<'PY'
          import re

          text = open("pyproject.toml").read()

          print(
              re.search(
                  r'(?m)^version\s*=\s*"(\d+\.\d+\.\d+)"',
                  text
              ).group(1)
          )
          PY
          )"

          echo "New rapidsim:     ${{ steps.version.outputs.version }}"
          echo ""
          echo "TEST ONLY:"
          echo "- no submodule update"
          echo "- no file changes"
          echo "- no commit"
          echo "- no push"
          echo "- no PyPI upload"
          echo "======================================"

      - name: Update RAPID submodule
        if: github.event_name == 'repository_dispatch' && github.event.action == 'rapid-release'
        run: |
          git -C external/RAPID fetch --tags
          git -C external/RAPID checkout "${{ steps.release.outputs.rapid_tag }}"

      - name: Update rapidsim version
        if: github.event_name == 'repository_dispatch' && github.event.action == 'rapid-release'
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import re

          new_version = os.environ["NEW_VERSION"]

          # Update pyproject.toml
          with open("pyproject.toml") as f:
              text = f.read()

          text, count = re.subn(
              r'(?m)^version\s*=\s*"\d+\.\d+\.\d+"',
              f'version = "{new_version}"',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update version in pyproject.toml"
              )

          with open("pyproject.toml", "w") as f:
              f.write(text)

          # Update setup.py
          with open("setup.py") as f:
              text = f.read()

          text, count = re.subn(
              r'version\s*=\s*"\d+\.\d+\.\d+"',
              f'version="{new_version}"',
              text,
              count=1,
          )

          if count != 1:
              raise SystemExit(
                  "Could not update version in setup.py"
              )

          with open("setup.py", "w") as f:
              f.write(text)
          PY

      - name: Commit release preparation
        if: github.event_name == 'repository_dispatch' && github.event.action == 'rapid-release'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pyproject.toml setup.py external/RAPID

          git commit \
            -m "release: rapidsim ${{ steps.version.outputs.version }}"

          git push