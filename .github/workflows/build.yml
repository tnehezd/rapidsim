name: Build rapidsim

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout rapidsim
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev libomp-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install hdf5 libomp

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build wheel
        run: |
          python -m build --wheel

      - name: Check wheel contents
        run: |
          python -m zipfile -l dist/*.whl | grep "rapidsim/data/simulation"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: rapidsim-${{ runner.os }}-wheel
          path: dist/*.whl
